log_level = "warn"
outputs = "All"
position = "Top"
app_launcher_cmd = "hyprlauncher"

# Colores Catppuccin Mocha
primary_color = "#cba6f7"   # Mauve (el color firma de Catppuccin)
success_color = "#a6e3a1"   # Green
text_color = "#cdd6f4"      # Text

# Configuración de Workspaces
workspace_colors = [ "#cba6f7", "#f5c2e7" ]         # Mauve y Pink
special_workspace_colors = [ "#89dceb", "#a6e3a1" ] # Sky y Green

[appearance.background_color]
base = "#1e1e2e"   # Base
weak = "#313244"   # Surface0
strong = "#585b70" # Surface2

[appearance.secondary_color]
base = "#181825"   # Mantle, mas oscuro para contraste

[appearance.danger_color]
base = "#f38ba8"   # Red
weak = "#fab387"   # Orange

[modules]
left = [ [ "Workspaces" ] ]
center = [ "WindowTitle" ]
right = [ "SystemInfo", [  "Tray", "Clock", "Privacy", "Settings" ] ]

[workspaces]
enable_workspace_filling = true

[window_title]
truncate_title_after_length = 100

[settings]
lock_cmd = "playerctl --all-players pause; hyprlock &"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"

[clock]
# Formato de 24h con fecha corta
format = "%H:%M - %a %d"

[appearance]
# ashell pide "DejaVu Sans" por omision y no esta instalada aqui. Al no
# resolverla hacia respaldo glifo a glifo con metricas inconsistentes, y
# "62 °C" salia como "6 2 °C". Fijada queda coherente con GTK y Hyprland.
font_name = "Cantarell"
style = "Islands"
