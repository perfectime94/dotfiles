<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- ==========  Familias por defecto  ========== -->
  <!-- sans-serif: Cantarell (UI). monospace: FiraCode Nerd Font Mono ya trae los glifos de iconos,
       asi que terminal, editores y barras los renderizan sin fallback. -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>FiraCode Nerd Font Mono</family></prefer>
  </alias>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Cantarell</family></prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>

  <!-- ==========  Respaldo universal de iconos  ==========
       Esta es la pieza que faltaba. Sin regla 'target=pattern' que anada
       Symbols Nerd Font a CADA peticion de fuente, cualquier app que use
       sans-serif (o una familia sin glifos Nerd) muestra cuadraditos.
       binding="weak" hace que solo actue como ultimo recurso: nunca
       sustituye a la fuente pedida, solo cubre los glifos que le faltan. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font</string>
    </edit>
  </match>

  <!-- Emoji en color, mismo mecanismo -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- ==========  Renderizado  ==========
       freetype esta compilado con cleartype-hinting, adobe-cff y harfbuzz,
       asi que conviene aprovecharlo. -->
  <match target="font">
    <edit name="antialias"  mode="assign"><bool>true</bool></edit>
    <edit name="hinting"    mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"  mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"       mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter"  mode="assign"><const>lcddefault</const></edit>
    <edit name="autohint"   mode="assign"><bool>false</bool></edit>
  </match>

</fontconfig>
