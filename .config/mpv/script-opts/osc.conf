# Catppuccin Mocha para la barra de control (puerto oficial catppuccin/mpv).
# ATENCION: aqui los colores van en BGR y SIN almohadilla, al contrario que en
# mpv.conf. Por ejemplo mauve #cba6f7 se escribe f7a6cb.
layout=bottombar
seekbarstyle=bar
seekbarkeyframes=no
boxalpha=80
timems=no
visibility=auto

# base #1e1e2e -> 2e1e1e
background_color=2e1e1e
# text #cdd6f4 -> f4d6cd
timecodes_color=f4d6cd
# mauve #cba6f7 -> f7a6cb
seekbarfg_color=f7a6cb
# surface2 #585b70 -> 705b58
seekbarbg_color=705b58
