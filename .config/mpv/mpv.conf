# --- Salida y aceleracion ------------------------------------------------
# vaapi: la iGPU Renoir del 5825U decodifica H.264/HEVC/VP9/AV1 en hardware.
# gpu-next es el nuevo motor de video de mpv, ya estable en 0.41.
vo=gpu-next
hwdec=vaapi
gpu-api=vulkan
gpu-context=waylandvk

# --- Audio --------------------------------------------------------------
ao=pipewire

# --- Interfaz: Catppuccin Mocha -----------------------------------------
# mpv acepta #RRGGBB en las opciones osd-*. Ojo: los colores de los SCRIPTS
# (script-opts/osc.conf) van en BGR y sin almohadilla, no en RGB.
background=#1E1E2E
osd-back-color=#1E1E2E
osd-color=#CDD6F4
osd-border-color=#11111B
osd-border-size=2
osd-font='Cantarell'
osd-font-size=32
osd-bar-align-y=0.9
osd-bar-h=2
osd-bar-w=60

# Subtitulos con la misma paleta
sub-color=#CDD6F4
sub-border-color=#11111B
sub-border-size=2.5
sub-font='Cantarell'
sub-font-size=42

# --- Comportamiento -----------------------------------------------------
keep-open=yes
save-position-on-quit=yes
screenshot-format=png
screenshot-directory=~/Imágenes/mpv
