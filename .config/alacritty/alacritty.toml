general.import = [
   "~/.config/alacritty/dracula.toml"
]

[env]
TERM = "xterm-256color"

[window]
padding.x = 5
padding.y = 5
decorations = "Buttonless"
opacity = 0.7
blur = true
option_as_alt = "Both"

[font]
normal.family = "FiraCode Nerd Font Mono"
size = 10

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

