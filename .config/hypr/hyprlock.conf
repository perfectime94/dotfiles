# Catppuccin Mocha, coherente con Alacritty, ashell, GTK y los bordes.
#   base #1e1e2e   surface1 #45475a   overlay1 #7f849c
#   text #cdd6f4   mauve #cba6f7      red #f38ba8   green #a6e3a1
background {
    monitor =
    path = /home/perfectime94/Imágenes/fondos/second-collection/soft-waves/dracula-soft-waves-bd93f9.png
    blur_passes = 2
    contrast = 0.9
    brightness = 0.7
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_center = true
    outer_color = rgb(cba6f7)
    inner_color = rgb(1e1e2e)
    font_color  = rgb(cdd6f4)
    fail_color  = rgb(f38ba8)
    check_color = rgb(a6e3a1)
    font_family = Cantarell
    placeholder_text = <i>Contraseña</i>
    fade_on_empty = false
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 64
    font_family = Cantarell
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(7f849c)
    font_size = 16
    font_family = Cantarell
    position = 0, 20
    halign = center
    valign = center
}
