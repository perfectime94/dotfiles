general {
    lock_cmd = pidof hyprlock || hyprlock          # evita instancias duplicadas
    before_sleep_cmd = loginctl lock-session       # bloquea ANTES de suspender
    after_sleep_cmd = hyprctl dispatch dpms on     # enciende pantalla al volver
}

# 2,5 min: atenua la pantalla (guarda el nivel para restaurarlo)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 min: bloquea
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5,5 min: apaga la pantalla
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 30 min: suspende (s2idle, que es lo que configuramos en la cmdline)
listener {
    timeout = 1800
    on-timeout = systemctl suspend || loginctl suspend
}
