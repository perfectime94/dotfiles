# hyprlauncher 0.1.6
#
# La ruta no esta documentada ni aparece en el binario: se determino metiendo
# una clave invalida a proposito y leyendo el error, que delata tanto el fichero
# como la sintaxis (categorias hyprlang, igual que hyprpaper).

general {
    # Roba el foco al abrir; sin esto en Hyprland puedes escribir en la ventana
    # de debajo sin darte cuenta.
    grab_focus = true
}

finders {
    # Solo entradas .desktop cuando no se escribe prefijo. Los otros finders
    # (unicode, math, font) siguen disponibles, pero SOLO si los invocas con su
    # prefijo, asi que no ensucian la lista de aplicaciones.
    default_finder = desktop

    # Muestra el icono de cada .desktop en la lista.
    desktop_icons = true

    # Terminal para las entradas con Terminal=true.
    desktop_terminal = alacritty

    # Prefijos: el de desktop se deja vacio porque ya es el finder por defecto.
    desktop_prefix =
    unicode_prefix = ?u
    math_prefix    = ?m
    font_prefix    = ?f
}

cache {
    # Ordena por frecuencia de uso: lo que mas abres sube.
    enabled = true
}

ui {
    window_size = 600 400
}
