# hyprqt6engine sustituye a qt6ct: tematiza las apps Qt6 (hyprpolkitagent).
# Acepta un esquema de color en formato KDE (KColorScheme).
# NOTA: Boosteroid es Qt5, asi que esto NO le afecta; para Qt5 haria falta
# Kvantum con catppuccin-kvantum.
theme {
    color_scheme = CatppuccinMocha
    icon_theme = Adwaita
    font_fixed = FiraCode Nerd Font Mono,10
}
